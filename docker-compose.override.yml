services:
    php:
        environment:
            DB_HOST: postgres
            DB_PORT: '5432'
            DB_DATABASE: hotel_system
            DB_USERNAME: hotel_app
            DB_PASSWORD: secret
            DB_MIGRATION_USERNAME: hotel_migrator
            DB_MIGRATION_PASSWORD: secret
            SESSION_DRIVER: redis
            CACHE_STORE: redis
            QUEUE_CONNECTION: redis
            BROADCAST_CONNECTION: reverb
            REDIS_CLIENT: phpredis
            REDIS_HOST: valkey-cache
            REDIS_PORT: '6379'
            REDIS_PASSWORD: secret
            REDIS_CACHE_HOST: valkey-cache
            REDIS_CACHE_PORT: '6379'
            REDIS_CACHE_PASSWORD: secret
            REDIS_CACHE_DB: '0'
            REDIS_QUEUE_HOST: valkey-queue
            REDIS_QUEUE_PORT: '6379'
            REDIS_QUEUE_PASSWORD: secret
            REDIS_QUEUE_DB: '0'
            REDIS_QUEUE_CONNECTION: queue
            HORIZON_REDIS_CONNECTION: queue
            REVERB_APP_ID: local
            REVERB_APP_KEY: local-reverb-key
            REVERB_APP_SECRET: local-reverb-secret
            REVERB_HOST: localhost
            REVERB_PORT: '8080'
            REVERB_SCHEME: http
            APP_URL: http://localhost
            CONCIERGE_AI_PROVIDER: openai
            CONCIERGE_AI_OPENAI_BASE_URL: https://api.openai.com/v1
            CONCIERGE_AI_OPENAI_API_KEY: ''
            CONCIERGE_AI_OPENAI_MODEL: gpt-4o-mini
            CONCIERGE_AI_ANTHROPIC_API_KEY: ''
            CONCIERGE_AI_ANTHROPIC_MODEL: claude-3-5-haiku-latest
            CONCIERGE_AI_OPENROUTER_API_KEY: ''
            CONCIERGE_AI_OPENROUTER_MODEL: openai/gpt-4o-mini
            CONCIERGE_AI_GOOGLE_API_KEY: ''
            CONCIERGE_AI_GOOGLE_MODEL: gemini-2.0-flash
    nginx:
        environment:
            SSL_DOMAIN: localhost
    valkey-cache:
        environment:
            REDIS_PASSWORD: secret
            REDIS_CACHE_PASSWORD: secret
        command: >
            valkey-server
              --maxmemory 256mb
              --maxmemory-policy allkeys-lru
              --requirepass secret
    valkey-queue:
        environment:
            REDIS_PASSWORD: secret
            REDIS_QUEUE_PASSWORD: secret
        command: >
            valkey-server
              --maxmemory 512mb
              --maxmemory-policy noeviction
              --appendonly yes
              --requirepass secret
    reverb:
        entrypoint: []
        command:
            - php
            - artisan
            - reverb:start
            - --port=8080
        environment:
            APP_KEY: base64:HMOVBJDlr6sYP0fMPaiFl4pvFwbdSZeP7d+piqOkxSw=
            APP_ENV: local
            APP_DEBUG: true
            APP_URL: http://localhost
            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: '5432'
            DB_DATABASE: hotel_system
            DB_USERNAME: hotel_app
            DB_PASSWORD: secret
            REDIS_CLIENT: phpredis
            REDIS_HOST: valkey-cache
            REDIS_PORT: '6379'
            REDIS_PASSWORD: secret
            REDIS_CACHE_HOST: valkey-cache
            REDIS_CACHE_PORT: '6379'
            REDIS_CACHE_PASSWORD: secret
            REDIS_CACHE_DB: '0'
            REDIS_QUEUE_HOST: valkey-queue
            REDIS_QUEUE_PORT: '6379'
            REDIS_QUEUE_PASSWORD: secret
            REDIS_QUEUE_DB: '0'
            SESSION_DRIVER: redis
            CACHE_STORE: redis
            QUEUE_CONNECTION: redis
            BROADCAST_CONNECTION: reverb
            REVERB_APP_ID: local
            REVERB_APP_KEY: local-reverb-key
            REVERB_APP_SECRET: local-reverb-secret
            REVERB_HOST: localhost
            REVERB_PORT: '8080'
            REVERB_SCHEME: http
