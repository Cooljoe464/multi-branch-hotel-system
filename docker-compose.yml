services:
    # ──────────────────────────────────────────────
    # Nginx — Reverse proxy + static assets + SSL
    # ──────────────────────────────────────────────
    nginx:
        image: nginx:1.27-alpine
        ports:
            - '80:80'
            - '443:443'
        volumes:
            - ./docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
            - ./docker/nginx/entrypoint.sh:/usr/local/bin/render-nginx.sh:ro
            - ./public:/app/public:ro
            - certbot_certs:/etc/letsencrypt
            - certbot_www:/var/www/certbot:ro
        environment:
            SSL_DOMAIN: ${SSL_DOMAIN:?Set SSL_DOMAIN to the bare domain (e.g. example.com)}
        entrypoint: ['sh', '/usr/local/bin/render-nginx.sh']
        depends_on:
            php:
                condition: service_healthy
            reverb:
                condition: service_started
        networks:
            - hms-network
        restart: unless-stopped

    # ──────────────────────────────────────────────
    # PHP-FPM — Application server
    # ──────────────────────────────────────────────
    php:
        build:
            context: .
            dockerfile: Dockerfile
            target: php
        environment:
            RUN_MIGRATIONS: 'true'
        volumes:
            - storage_data:/app/storage
            - certbot_www:/var/www/certbot:ro
        depends_on:
            postgres:
                condition: service_healthy
            valkey-cache:
                condition: service_healthy
            valkey-queue:
                condition: service_healthy
        env_file: .env
        networks:
            - hms-network
        healthcheck:
            test: ['CMD-SHELL', 'test -f /tmp/hms-migrations-ready && php-fpm -t >/dev/null 2>&1']
            interval: 5s
            timeout: 5s
            retries: 30
            start_period: 90s
        restart: unless-stopped

    # ──────────────────────────────────────────────
    # PostgreSQL — Database
    # ──────────────────────────────────────────────
    postgres:
        image: postgres:18.6-alpine
        volumes:
            - postgres_data:/var/lib/postgresql
            - ./docker/postgres/10-application-role.sh:/docker-entrypoint-initdb.d/10-application-role.sh:ro
        environment:
            POSTGRES_DB: ${DB_DATABASE:-hotel_system}
            POSTGRES_USER: ${DB_MIGRATION_USERNAME:?Set DB_MIGRATION_USERNAME}
            POSTGRES_PASSWORD: ${DB_MIGRATION_PASSWORD:?Set DB_MIGRATION_PASSWORD}
            DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME}
            DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U ${DB_MIGRATION_USERNAME:?Set DB_MIGRATION_USERNAME} -d ${DB_DATABASE:-hotel_system}',
                ]
            interval: 5s
            timeout: 5s
            retries: 5
        networks:
            - hms-network
        restart: unless-stopped

    # ──────────────────────────────────────────────
    # Valkey cache — disposable cache, session, and lock data
    # ──────────────────────────────────────────────
    valkey-cache:
        image: valkey/valkey:8.1.10-alpine3.24
        environment:
            REDIS_PASSWORD: ${REDIS_PASSWORD:?Set a strong REDIS_PASSWORD}
            REDIS_CACHE_PASSWORD: ${REDIS_CACHE_PASSWORD:-${REDIS_PASSWORD:?Set a strong REDIS_PASSWORD}}
        volumes:
            - valkey_cache_data:/data
        command: >
            valkey-server
              --maxmemory 256mb
              --maxmemory-policy allkeys-lru
              --requirepass ${REDIS_CACHE_PASSWORD:-${REDIS_PASSWORD:?Set a strong REDIS_PASSWORD}}
        healthcheck:
            test: ['CMD-SHELL', 'valkey-cli -a "$${REDIS_CACHE_PASSWORD:-$${REDIS_PASSWORD}}" ping | grep PONG']
            interval: 5s
            timeout: 3s
            retries: 5
        networks:
            - hms-network
        restart: unless-stopped

    # Valkey queue — durable jobs cannot be evicted by cache pressure.
    valkey-queue:
        image: valkey/valkey:8.1.10-alpine3.24
        environment:
            REDIS_PASSWORD: ${REDIS_PASSWORD:?Set a strong REDIS_PASSWORD}
            REDIS_QUEUE_PASSWORD: ${REDIS_QUEUE_PASSWORD:-${REDIS_PASSWORD:?Set a strong REDIS_PASSWORD}}
        volumes:
            - valkey_queue_data:/data
        command: >
            valkey-server
              --maxmemory 512mb
              --maxmemory-policy noeviction
              --appendonly yes
              --requirepass ${REDIS_QUEUE_PASSWORD:-${REDIS_PASSWORD:?Set a strong REDIS_PASSWORD}}
        healthcheck:
            test: ['CMD-SHELL', 'valkey-cli -a "$${REDIS_QUEUE_PASSWORD:-$${REDIS_PASSWORD}}" ping | grep PONG']
            interval: 5s
            timeout: 3s
            retries: 5
        networks:
            - hms-network
        restart: unless-stopped

    # ──────────────────────────────────────────────
    # Queue Worker — Processes background jobs
    # ──────────────────────────────────────────────
    queue:
        build:
            context: .
            dockerfile: Dockerfile
            target: php
        command:
            ['supervisord', '-c', '/etc/supervisor/conf.d/supervisord.conf']
        volumes:
            - storage_data:/app/storage
        depends_on:
            php:
                condition: service_healthy
            valkey-cache:
                condition: service_healthy
            valkey-queue:
                condition: service_healthy
            postgres:
                condition: service_healthy
        env_file: .env
        networks:
            - hms-network
        restart: unless-stopped

    # ──────────────────────────────────────────────
    # Scheduler — Laravel cron runner (single instance;
    # jobs themselves guard with onOneServer)
    # ──────────────────────────────────────────────
    scheduler:
        build:
            context: .
            dockerfile: Dockerfile
            target: php
        command: >
            sh -c "while true; do php artisan schedule:run --verbose --no-interaction >> /proc/1/fd/1 2>&1; sleep 60; done"
        volumes:
            - storage_data:/app/storage
        depends_on:
            php:
                condition: service_healthy
            valkey-cache:
                condition: service_healthy
            valkey-queue:
                condition: service_healthy
            postgres:
                condition: service_healthy
        env_file: .env
        networks:
            - hms-network
        restart: unless-stopped
        deploy:
            replicas: 1

    # ──────────────────────────────────────────────
    # Reverb — WebSocket server
    # ──────────────────────────────────────────────
    reverb:
        build:
            context: .
            dockerfile: Dockerfile
            target: php
        command: ['php', 'artisan', 'reverb:start', '--port=8080']
        ports:
            - '8080:8080'
        volumes:
            - storage_data:/app/storage
        depends_on:
            php:
                condition: service_healthy
            valkey-cache:
                condition: service_healthy
        env_file: .env
        networks:
            - hms-network
        restart: unless-stopped

# ──────────────────────────────────────────────
# Volumes
# ──────────────────────────────────────────────
volumes:
    postgres_data:
    valkey_cache_data:
    valkey_queue_data:
    storage_data:
    certbot_certs:
    certbot_www:

# ──────────────────────────────────────────────
# Networks
# ──────────────────────────────────────────────
networks:
    hms-network:
        driver: bridge
