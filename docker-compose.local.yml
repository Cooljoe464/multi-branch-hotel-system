services:
    app:
        build:
            context: .
            dockerfile: docker/local.Dockerfile
        working_dir: /app
        volumes:
            - .:/app
        ports:
            - '8001:8000'
        env_file: .env
        environment:
            APP_ENV: local
            APP_DEBUG: 'true'
            APP_URL: http://localhost:8001
            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: 5432
            DB_DATABASE: hotel_system
            DB_USERNAME: root
            DB_PASSWORD: secret
            REDIS_HOST: redis
            REDIS_PORT: 6379
            REVERB_HOST: reverb
            REVERB_PORT: 8080
            REVERB_SCHEME: http
            REVERB_SERVER_HOST: 0.0.0.0
        command: >
            sh -lc "php artisan config:clear
            && php artisan migrate --force
            && php -S 0.0.0.0:8000 -t public"
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        restart: unless-stopped

    horizon:
        build:
            context: .
            dockerfile: docker/local.Dockerfile
        working_dir: /app
        volumes:
            - .:/app
        env_file: .env
        environment:
            APP_ENV: local
            APP_DEBUG: 'true'
            APP_URL: http://localhost:8001
            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: 5432
            DB_DATABASE: hotel_system
            DB_USERNAME: root
            DB_PASSWORD: secret
            REDIS_HOST: redis
            REDIS_PORT: 6379
            REVERB_HOST: reverb
            REVERB_PORT: 8080
            REVERB_SCHEME: http
        command: php artisan horizon
        depends_on:
            app:
                condition: service_started
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        restart: unless-stopped

    scheduler:
        build:
            context: .
            dockerfile: docker/local.Dockerfile
        working_dir: /app
        volumes:
            - .:/app
        env_file: .env
        environment:
            APP_ENV: local
            APP_DEBUG: 'true'
            APP_URL: http://localhost:8001
            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: 5432
            DB_DATABASE: hotel_system
            DB_USERNAME: root
            DB_PASSWORD: secret
            REDIS_HOST: redis
            REDIS_PORT: 6379
            REVERB_HOST: reverb
            REVERB_PORT: 8080
            REVERB_SCHEME: http
        command: >
            sh -lc "while true; do
            php artisan schedule:run --no-interaction;
            sleep 60;
            done"
        depends_on:
            app:
                condition: service_started
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        restart: unless-stopped

    reverb:
        build:
            context: .
            dockerfile: docker/local.Dockerfile
        working_dir: /app
        volumes:
            - .:/app
        ports:
            - '8081:8080'
        env_file: .env
        environment:
            APP_ENV: local
            APP_DEBUG: 'true'
            APP_URL: http://localhost:8001
            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: 5432
            DB_DATABASE: hotel_system
            DB_USERNAME: root
            DB_PASSWORD: secret
            REDIS_HOST: redis
            REDIS_PORT: 6379
            REVERB_HOST: reverb
            REVERB_PORT: 8080
            REVERB_SCHEME: http
            REVERB_SERVER_HOST: 0.0.0.0
        command: php artisan reverb:start --host=0.0.0.0 --port=8080
        depends_on:
            app:
                condition: service_started
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        restart: unless-stopped

    postgres:
        image: postgres:18-alpine
        environment:
            POSTGRES_DB: hotel_system
            POSTGRES_USER: root
            POSTGRES_PASSWORD: secret
        volumes:
            - postgres_local_data:/var/lib/postgresql
        ports:
            - '5433:5432'
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U root -d hotel_system']
            interval: 5s
            timeout: 5s
            retries: 10
        restart: unless-stopped

    redis:
        image: redis:7-alpine
        command: >
            sh -c 'if [ "$$REDIS_PASSWORD" = "null" ] || [ -z "$$REDIS_PASSWORD" ]; then
            redis-server --appendonly yes;
            else
            redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes;
            fi'
        env_file: .env
        volumes:
            - redis_local_data:/data
        ports:
            - '6380:6379'
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'if [ "$$REDIS_PASSWORD" = "null" ] || [ -z "$$REDIS_PASSWORD" ]; then redis-cli ping; else redis-cli -a "$$REDIS_PASSWORD" ping; fi | grep PONG',
                ]
            interval: 5s
            timeout: 5s
            retries: 10
        restart: unless-stopped

volumes:
    postgres_local_data:
    redis_local_data:
