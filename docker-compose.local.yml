services:
    app:
        build:
            context: .
            dockerfile: docker/local.Dockerfile
        working_dir: /app
        volumes:
            - .:/app
        ports:
            - '8001:8000'
        env_file: .env
        environment:
            APP_ENV: local
            APP_DEBUG: 'true'
            APP_URL: http://localhost:8001
            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: 5432
            DB_DATABASE: hotel_system
            DB_USERNAME: hotel_app
            DB_PASSWORD: secret
            DB_MIGRATION_USERNAME: ${DB_MIGRATION_USERNAME:-hotel_migrator}
            DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:-secret}
            REDIS_HOST: valkey-cache
            REDIS_PORT: 6379
            REDIS_CACHE_HOST: valkey-cache
            REDIS_QUEUE_HOST: valkey-queue
            REDIS_QUEUE_CONNECTION: queue
            REVERB_HOST: reverb
            REVERB_PORT: 8080
            REVERB_SCHEME: http
            REVERB_SERVER_HOST: 0.0.0.0
        command: >
            sh -lc "php artisan config:clear
            && php artisan db:provision-runtime-role --no-interaction
            && php artisan migrate --database=migration --force
            && php -S 0.0.0.0:8000 -t public"
        depends_on:
            postgres:
                condition: service_healthy
            valkey-cache:
                condition: service_healthy
            valkey-queue:
                condition: service_healthy
        restart: unless-stopped

    horizon:
        build:
            context: .
            dockerfile: docker/local.Dockerfile
        working_dir: /app
        volumes:
            - .:/app
        env_file: .env
        environment:
            APP_ENV: local
            APP_DEBUG: 'true'
            APP_URL: http://localhost:8001
            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: 5432
            DB_DATABASE: hotel_system
            DB_USERNAME: hotel_app
            DB_PASSWORD: secret
            DB_MIGRATION_USERNAME: ${DB_MIGRATION_USERNAME:-hotel_migrator}
            DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:-secret}
            REDIS_HOST: valkey-cache
            REDIS_PORT: 6379
            REDIS_CACHE_HOST: valkey-cache
            REDIS_QUEUE_HOST: valkey-queue
            REDIS_QUEUE_CONNECTION: queue
            REVERB_HOST: reverb
            REVERB_PORT: 8080
            REVERB_SCHEME: http
        command: php artisan horizon
        depends_on:
            app:
                condition: service_started
            postgres:
                condition: service_healthy
            valkey-cache:
                condition: service_healthy
            valkey-queue:
                condition: service_healthy
        restart: unless-stopped

    scheduler:
        build:
            context: .
            dockerfile: docker/local.Dockerfile
        working_dir: /app
        volumes:
            - .:/app
        env_file: .env
        environment:
            APP_ENV: local
            APP_DEBUG: 'true'
            APP_URL: http://localhost:8001
            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: 5432
            DB_DATABASE: hotel_system
            DB_USERNAME: hotel_app
            DB_PASSWORD: secret
            DB_MIGRATION_USERNAME: ${DB_MIGRATION_USERNAME:-hotel_migrator}
            DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:-secret}
            REDIS_HOST: valkey-cache
            REDIS_PORT: 6379
            REDIS_CACHE_HOST: valkey-cache
            REDIS_QUEUE_HOST: valkey-queue
            REDIS_QUEUE_CONNECTION: queue
            REVERB_HOST: reverb
            REVERB_PORT: 8080
            REVERB_SCHEME: http
        command: >
            sh -lc "while true; do
            php artisan schedule:run --no-interaction;
            sleep 60;
            done"
        depends_on:
            app:
                condition: service_started
            postgres:
                condition: service_healthy
            valkey-cache:
                condition: service_healthy
            valkey-queue:
                condition: service_healthy
        restart: unless-stopped

    reverb:
        build:
            context: .
            dockerfile: docker/local.Dockerfile
        working_dir: /app
        volumes:
            - .:/app
        ports:
            - '8081:8080'
        env_file: .env
        environment:
            APP_ENV: local
            APP_DEBUG: 'true'
            APP_URL: http://localhost:8001
            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: 5432
            DB_DATABASE: hotel_system
            DB_USERNAME: hotel_app
            DB_PASSWORD: secret
            DB_MIGRATION_USERNAME: ${DB_MIGRATION_USERNAME:-hotel_migrator}
            DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:-secret}
            REDIS_HOST: valkey-cache
            REDIS_PORT: 6379
            REDIS_CACHE_HOST: valkey-cache
            REDIS_QUEUE_HOST: valkey-queue
            REDIS_QUEUE_CONNECTION: queue
            REVERB_HOST: reverb
            REVERB_PORT: 8080
            REVERB_SCHEME: http
            REVERB_SERVER_HOST: 0.0.0.0
        command: php artisan reverb:start --host=0.0.0.0 --port=8080
        depends_on:
            app:
                condition: service_started
            postgres:
                condition: service_healthy
            valkey-cache:
                condition: service_healthy
            valkey-queue:
                condition: service_healthy
        restart: unless-stopped

    postgres:
        image: postgres:18.6-alpine
        environment:
            POSTGRES_DB: hotel_system
            POSTGRES_USER: ${DB_MIGRATION_USERNAME:-hotel_migrator}
            POSTGRES_PASSWORD: ${DB_MIGRATION_PASSWORD:-secret}
            DB_USERNAME: hotel_app
            DB_PASSWORD: secret
        volumes:
            - postgres_local_data:/var/lib/postgresql
            - ./docker/postgres/10-application-role.sh:/docker-entrypoint-initdb.d/10-application-role.sh:ro
        ports:
            - '5433:5432'
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${DB_MIGRATION_USERNAME:-hotel_migrator} -d hotel_system']
            interval: 5s
            timeout: 5s
            retries: 10
        restart: unless-stopped

    valkey-cache:
        image: valkey/valkey:8.1.10-alpine3.24
        command: >
            sh -c 'valkey-server --maxmemory 256mb --maxmemory-policy allkeys-lru
            --requirepass "$$REDIS_CACHE_PASSWORD"'
        environment:
            REDIS_PASSWORD: ${REDIS_PASSWORD:-secret}
            REDIS_CACHE_PASSWORD: ${REDIS_CACHE_PASSWORD:-${REDIS_PASSWORD:-secret}}
        volumes:
            - valkey_cache_local_data:/data
        ports:
            - '6380:6379'
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'valkey-cli -a "$$REDIS_CACHE_PASSWORD" ping | grep PONG',
                ]
            interval: 5s
            timeout: 5s
            retries: 10
        restart: unless-stopped

    valkey-queue:
        image: valkey/valkey:8.1.10-alpine3.24
        command: >
            sh -c 'valkey-server --maxmemory 512mb --maxmemory-policy noeviction --appendonly yes
            --requirepass "$$REDIS_QUEUE_PASSWORD"'
        environment:
            REDIS_PASSWORD: ${REDIS_PASSWORD:-secret}
            REDIS_QUEUE_PASSWORD: ${REDIS_QUEUE_PASSWORD:-${REDIS_PASSWORD:-secret}}
        volumes:
            - redis_local_data:/data
        healthcheck:
            test: ['CMD-SHELL', 'valkey-cli -a "$$REDIS_QUEUE_PASSWORD" ping | grep PONG']
            interval: 5s
            timeout: 5s
            retries: 10
        restart: unless-stopped

volumes:
    postgres_local_data:
    valkey_cache_local_data:
    redis_local_data:
